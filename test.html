<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="description" content="24 或 36 道心灵问题，测一测你的灵魂与哪位星穹铁道角色同频共振。" />
  <meta property="og:title" content="心灵观测 · 答题 | 崩铁人格测试" />
  <meta property="og:description" content="凭第一感觉作答，看看你的灵魂与哪位星穹铁道角色同频共振。" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://1820070208.github.io/hsr-persona-test/assets/img/og-cover.jpg" />
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 1 L14.3 9.7 L23 12 L14.3 14.3 L12 23 L9.7 14.3 L1 12 L9.7 9.7 Z' fill='%23e8bf6f'/%3E%3C/svg%3E" />
  <title>心灵观测 · 答题 | 崩铁人格测试</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <div class="nebula nebula-1" aria-hidden="true"></div>
  <div class="nebula nebula-2" aria-hidden="true"></div>
  <div class="planet" aria-hidden="true"></div>

  <main class="hero page-flow">
    <section id="screen-intro" class="screen">
      <div class="panel panel-wide">
        <svg class="sparkle sparkle-lg" viewBox="0 0 24 24" aria-hidden="true">
          <defs>
            <linearGradient id="spark-grad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff6d8" />
              <stop offset="1" stop-color="#d9a94f" />
            </linearGradient>
          </defs>
          <path d="M12 1 L14.3 9.7 L23 12 L14.3 14.3 L12 23 L9.7 14.3 L1 12 L9.7 9.7 Z" fill="url(#spark-grad)" />
        </svg>
        <h2>心灵观测 · 准备发车</h2>
        <div class="version-picker" id="version-picker">
          <button class="version-card selected" data-version="standard" type="button">
            <span class="version-name">快速版</span>
            <span class="version-meta">24 题 · 约 3 分钟</span>
            <span class="version-desc">核心题库，快速出发</span>
          </button>
          <button class="version-card" data-version="deep" type="button">
            <span class="version-name">详细版</span>
            <span class="version-meta">36 题 · 约 5 分钟</span>
            <span class="version-desc">增补进阶题目，判定更细腻</span>
          </button>
          <button class="version-card" data-version="pro" type="button">
            <span class="version-name">专业版</span>
            <span class="version-meta">48 题 · 约 6 分钟</span>
            <span class="version-desc">全量题库，观测最精准</span>
          </button>
        </div>
        <p class="intro-tip">没有对错与好坏，凭第一感觉选择就好。</p>
        <button id="btn-start" class="btn btn-primary" type="button">开始答题</button>
        <div><a class="text-link" href="index.html">← 返回首页</a></div>
      </div>
    </section>

    <section id="screen-quiz" class="screen" hidden>
      <div class="quiz-head">
        <div class="quiz-progress-text">第 <span id="quiz-index">1</span> / <span id="quiz-total">24</span> 题</div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
      <div class="quiz-card" id="quiz-card">
        <div class="quiz-tag" id="quiz-tag">心灵观测</div>
        <h2 class="quiz-question" id="quiz-question"></h2>
        <div class="quiz-options" id="quiz-options"></div>
      </div>
      <div><button id="btn-prev" class="text-link" type="button" hidden>← 上一题</button></div>
    </section>

    <section id="screen-calc" class="screen" hidden>
      <div class="calc-star" aria-hidden="true">✦</div>
      <p class="calc-text">正在对照星图</p>
    </section>

    <section id="screen-result" class="screen" hidden>
      <div class="result-backdrop" aria-hidden="true"><img id="result-backdrop-img" alt="" /></div>
      <div class="badge"><span class="t">观测完成</span></div>
      <div class="result-avatar"><img id="result-avatar" alt="角色头像" /></div>
      <h2 class="result-title" id="result-title"></h2>
      <p class="result-character" id="result-character"></p>
      <div class="result-sub" id="result-sub" hidden></div>
      <p class="result-blurb" id="result-blurb"></p>
      <p class="result-quote" id="result-quote"></p>

      <div class="result-section">
        <h3 class="section-title">人格画像</h3>
        <div class="profile-text" id="profile-text"></div>
      </div>

      <div class="result-section">
        <h3 class="section-title">四维星图</h3>
        <div id="radar-wrap"></div>
        <div class="axes" id="result-axes"></div>
        <div class="axis-texts" id="axis-texts"></div>
      </div>

      <div class="result-section">
        <h3 class="section-title">闪光点</h3>
        <ul class="trait-list" id="strengths"></ul>
      </div>

      <div class="result-section">
        <h3 class="section-title">影子面</h3>
        <ul class="trait-list shadow" id="shadows"></ul>
      </div>

      <div class="result-section">
        <h3 class="section-title">灵魂同频</h3>
        <div class="partner-card" id="partner-card"></div>
      </div>

      <nav class="buttons">
        <a class="btn btn-primary" href="unlocked.html">查看人格图鉴</a>
        <button class="btn btn-ghost" id="btn-share" type="button">生成分享卡</button>
        <button class="btn btn-ghost" id="btn-retry" type="button">再测一次</button>
      </nav>
      <div><a class="text-link" href="index.html">← 返回首页</a></div>
    </section>
  </main>

  <div class="share-modal" id="share-modal" hidden>
    <div class="share-panel">
      <img id="share-image" alt="崩铁人格测试分享卡" />
      <p class="share-tip" id="share-tip">长按图片保存到手机，或点击下载</p>
      <div class="share-actions">
        <a class="btn btn-primary" id="share-download" download="崩铁人格测试.png" type="button">下载图片</a>
        <button class="btn btn-ghost" id="share-close" type="button">关闭</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>粉丝二创作品 · 与 miHoYo / HoYoverse 无关 · 角色版权归原作所有</p>
  </footer>

  <script src="assets/js/questions.js"></script>
  <script src="assets/js/personas.js"></script>
  <script src="assets/js/persona-content.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/test.js"></script>
  <script src="assets/js/share-card.js"></script>
</body>
</html>
