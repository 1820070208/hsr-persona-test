<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="description" content="崩铁 × 原神双世界人格测试：选择你的世界，测一测你的灵魂与哪位角色同频共振。" />
  <meta property="og:title" content="人格测试 · 崩铁 × 原神" />
  <meta property="og:description" content="选择你的世界：星穹列车或提瓦特，测一测你的灵魂与哪位角色同频共振。" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://1820070208.github.io/hsr-persona-test/assets/img/og-cover.jpg" />
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 1 L14.3 9.7 L23 12 L14.3 14.3 L12 23 L9.7 14.3 L1 12 L9.7 9.7 Z' fill='%23e8bf6f'/%3E%3C/svg%3E" />
  <title>人格测试 · 你和哪位角色最像？</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <img class="page-bg" src="assets/img/home-bg.jpg" alt="" aria-hidden="true" />
  <canvas id="starfield" aria-hidden="true"></canvas>
  <div class="nebula nebula-1" aria-hidden="true"></div>
  <div class="nebula nebula-2" aria-hidden="true"></div>
  <div class="planet" aria-hidden="true"></div>

  <main class="hero">
    <div class="badge"><span class="t">心灵观测总部</span></div>

    <svg class="sparkle" viewBox="0 0 24 24" aria-hidden="true">
      <defs>
        <linearGradient id="spark-grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff6d8" />
          <stop offset="1" stop-color="#d9a94f" />
        </linearGradient>
      </defs>
      <path d="M12 1 L14.3 9.7 L23 12 L14.3 14.3 L12 23 L9.7 14.3 L1 12 L9.7 9.7 Z" fill="url(#spark-grad)" />
    </svg>

    <h1 class="title">
      <span class="title-top">崩坏：星穹铁道 × 原神</span>
      <span class="title-main">人格测试</span>
    </h1>

    <p class="subtitle">选择你的世界，测一测你的灵魂与哪位角色同频共振</p>

    <div class="ornament" aria-hidden="true"><i></i>✦<i></i></div>

    <div class="mode-grid">
      <section class="mode-card hsr">
        <div class="mode-tag">星穹列车 · 心灵观测计划</div>
        <h2 class="mode-name">崩坏：星穹铁道</h2>
        <p class="mode-desc">32 位乘员 · 24 / 36 / 48 题三档</p>
        <div class="mode-strip" id="hsr-strip" aria-label="列车乘员"></div>
        <nav class="mode-actions">
          <a class="btn btn-primary" href="test.html">开始测试</a>
          <a class="btn btn-ghost" href="unlocked.html">人格图鉴<span class="count-pill" id="hsrUnlockedCount" hidden>0</span></a>
        </nav>
      </section>

      <section class="mode-card gs">
        <div class="mode-tag">冒险家协会 · 心灵观测支部</div>
        <h2 class="mode-name">原神 · 提瓦特</h2>
        <p class="mode-desc">40 位同路人 · 24 / 36 / 48 题三档</p>
        <div class="mode-strip" id="gs-strip" aria-label="提瓦特同路人"></div>
        <nav class="mode-actions">
          <a class="btn btn-primary" href="genshin/test.html">开始测试</a>
          <a class="btn btn-ghost" href="genshin/unlocked.html">人格图鉴<span class="count-pill" id="gsUnlockedCount" hidden>0</span></a>
        </nav>
      </section>
    </div>

    <p class="hint">测试在你的浏览器本地完成，结果只保存在这台设备上</p>
  </main>

  <footer class="footer">
    <p>粉丝二创作品 · 与 miHoYo / HoYoverse 无关 · 角色版权归原作所有</p>
  </footer>

  <script src="assets/js/personas.js"></script>
  <script src="genshin/assets/js/personas.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/home.js"></script>
</body>
</html>
